<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== 흰 큰 카드 ===== -->
  <div class="page">
    <!-- 왼쪽: ABOUT ME -->
    <aside class="side">
      <p class="side-label">ABOUT ME</p>
      <div class="photo" id="photo"></div>
      <h2 class="name" id="name">불러오는 중…</h2>
      <p class="role" id="title"></p>
      <span class="career" id="career-badge" hidden></span>

      <ul class="contacts">
        <li>
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5.3 0-9 2.7-9 6v2h18v-2c0-3.3-3.7-6-9-6Z"/></svg></span>
          <div><small>이름</small><strong id="contact-name"></strong></div>
        </li>
        <li>
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5h20v14H2V5Zm2 2v.5l8 5 8-5V7H4Z"/></svg></span>
          <div><small>이메일</small><strong><a id="contact-email"></a></strong></div>
        </li>
        <li>
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg></span>
          <div><small>연락처</small><strong><a id="contact-phone"></a></strong></div>
        </li>
        <li>
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg></span>
          <div><small>위치</small><strong id="contact-location"></strong></div>
        </li>
      </ul>
    </aside>

    <!-- 오른쪽: PORTFOLIO -->
    <main class="main">
      <h1 class="title">PORTFOLIO</h1>
      <p class="headline" id="headline"></p>
      <p class="intro" id="intro"></p>

      <hr />

      <section class="facts">
        <div>
          <h3><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3Zm-7 9.2v4L12 20l7-3.8v-4L12 16l-7-3.8Z"/></svg>EDUCATION</h3>
          <div class="fact-body" id="education"></div>
        </div>
        <div>
          <h3><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2Z"/></svg>SKILLS &amp; TOOLS</h3>
          <ul class="fact-body skills" id="skills"></ul>
        </div>
        <div>
          <h3><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6a2 2 0 0 1 2 2v2h4a1 1 0 0 1 1 1v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a1 1 0 0 1 1-1h4V5a2 2 0 0 1 2-2Zm0 4h6V5H9v2Zm-7 5h20v1H2v-1Z"/></svg>EXPERIENCE</h3>
          <div class="fact-body" id="experience"></div>
        </div>
      </section>

      <section class="highlights">
        <header>
          <h3>PORTFOLIO HIGHLIGHTS</h3>
          <p>(카드를 터치하면 상세 기획서를 보실 수 있습니다)</p>
        </header>
        <div class="cards" id="cards">
          <p class="empty">카드를 불러오는 중…</p>
        </div>
      </section>

      <p class="quote" id="quote"></p>
    </main>
  </div>

  <!-- ===== 방명록 ===== -->
  <section class="guestbook">
    <h2 class="title small">GUESTBOOK</h2>
    <p class="gb-sub">방문해 주셔서 감사합니다. 한마디 남겨 주세요.</p>

    <div class="gb-form">
      <input type="text" id="gb-nickname" maxlength="20" placeholder="별명 (20자까지)" />
      <textarea id="gb-message" maxlength="200" rows="3" placeholder="한마디 (200자까지)"></textarea>
      <div class="gb-actions">
        <span class="gb-status" id="gb-status"></span>
        <button type="button" id="gb-submit">남기기</button>
      </div>
    </div>

    <ul class="gb-list" id="gb-list">
      <li class="empty">방명록을 불러오는 중…</li>
    </ul>
  </section>

  <footer class="site-foot"><a href="admin.html">관리자</a></footer>

  <script src="script.js"></script>
</body>
</html>
