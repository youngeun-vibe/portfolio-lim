<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>관리자 | 포트폴리오</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="admin-wrap">
    <!-- 맨 위 줄 -->
    <header class="admin-top">
      <h1 class="title">ADMIN</h1>
      <div class="admin-top-right">
        <span class="who" id="who"></span>
        <a class="btn ghost" href="index.html">방문자 화면 보기</a>
        <button type="button" class="btn ghost" id="logout-btn" hidden>로그아웃</button>
      </div>
    </header>

    <!-- 로그인 -->
    <section class="panel login" id="login-view" hidden>
      <h2>관리자 로그인</h2>
      <label class="field">
        <span>이메일</span>
        <input type="email" id="login-email" autocomplete="username" />
      </label>
      <label class="field">
        <span>비밀번호</span>
        <input type="password" id="login-password" autocomplete="current-password" />
      </label>
      <button type="button" class="btn" id="login-btn">로그인</button>
      <p class="msg" id="login-msg"></p>
    </section>

    <!-- 관리자가 아닐 때 -->
    <section class="panel login" id="denied-view" hidden>
      <h2>관리자만 쓸 수 있어요</h2>
      <p class="hint">이 계정은 관리자로 등록되어 있지 않아요. 다른 계정으로 로그인하려면 오른쪽 위 로그아웃을 눌러 주세요.</p>
    </section>

    <!-- 불러오는 중 -->
    <p class="hint center" id="loading-view">확인하는 중…</p>

    <!-- 관리자 화면 -->
    <div id="admin-view" hidden>
      <!-- 프로필 -->
      <section class="panel">
        <h2>프로필</h2>
        <div class="profile-photo-row">
          <div class="photo small" id="pf-photo"></div>
          <div>
            <label class="field">
              <span>프로필 사진 (PNG·JPG·WEBP·GIF, 10MB까지) — 고르면 바로 바뀌어요</span>
              <input type="file" id="pf-photo-input" accept="image/png,image/jpeg,image/webp,image/gif" />
            </label>
            <p class="msg" id="pf-photo-msg"></p>
          </div>
        </div>
        <div class="field-grid" id="profile-fields"></div>
        <div class="row-end">
          <p class="msg" id="profile-msg"></p>
          <button type="button" class="btn" id="profile-save">프로필 저장</button>
        </div>
      </section>

      <!-- 포트폴리오 카드 -->
      <section class="panel">
        <div class="panel-head">
          <h2>포트폴리오 카드</h2>
          <button type="button" class="btn" id="project-add">+ 카드 추가</button>
        </div>

        <div class="edit-box" id="project-form" hidden>
          <h3 id="project-form-title">새 카드</h3>
          <div class="field-grid">
            <label class="field"><span>번호 (예: 01)</span><input type="text" id="pj-number" /></label>
            <label class="field"><span>분류</span><input type="text" id="pj-category" /></label>
            <label class="field wide"><span>제목 (꼭 적기)</span><input type="text" id="pj-title" /></label>
            <label class="field wide"><span>설명</span><textarea id="pj-description" rows="3"></textarea></label>
            <label class="field wide"><span>태그 (쉼표로 나누기)</span><input type="text" id="pj-tags" /></label>

            <div class="field">
              <span>썸네일 이미지 (PNG·JPG·WEBP·GIF, 10MB까지)</span>
              <div class="file-now">
                <div class="thumb" id="pj-thumb-preview"></div>
                <button type="button" class="btn ghost small" id="pj-thumb-clear">빼기</button>
              </div>
              <input type="file" id="pj-thumb" accept="image/png,image/jpeg,image/webp,image/gif" />
            </div>
            <div class="field">
              <span>첨부 파일 (이미지 또는 PDF, 10MB까지)</span>
              <div class="file-now">
                <a class="file-link" id="pj-file-link" target="_blank" rel="noopener"></a>
                <button type="button" class="btn ghost small" id="pj-file-clear">빼기</button>
              </div>
              <input type="file" id="pj-file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf" />
            </div>
          </div>
          <div class="row-end">
            <p class="msg" id="project-msg"></p>
            <button type="button" class="btn ghost" id="project-cancel">취소</button>
            <button type="button" class="btn" id="project-save">카드 저장</button>
          </div>
        </div>

        <ul class="admin-list" id="project-list"></ul>
        <p class="msg" id="project-list-msg"></p>
      </section>

      <!-- 좋아요 -->
      <section class="panel">
        <h2>좋아요</h2>
        <ul class="admin-list" id="like-list"></ul>
        <p class="msg" id="like-msg"></p>
      </section>

      <!-- 방명록 -->
      <section class="panel">
        <div class="panel-head">
          <h2>방명록</h2>
          <button type="button" class="btn ghost" id="guestbook-reload">새로고침</button>
        </div>
        <ul class="admin-list" id="guestbook-list"></ul>
        <p class="msg" id="guestbook-msg"></p>
      </section>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
